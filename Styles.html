<style>
  /* ==========================================================================
     LIPPO PLAZA BAUBAU — DIGITAL SERVICE PORTAL
     Mobile-First Design System & Stylesheet
     ========================================================================== */

  :root {
    --brand-blue: #0054a6;
    --brand-blue-dark: #003f82;
    --brand-blue-deep: #00264d;
    --brand-cyan: #20d7f3;
    --brand-cyan-glow: rgba(32, 215, 243, 0.4);
    
    --bg-page: #f2f7fc;
    --surface: #ffffff;
    --surface-soft: #eaf4fd;
    --surface-hover: #f8fbfe;
    
    --text-primary: #172b4d;
    --text-secondary: #4a6585;
    --text-muted: #7a8fa6;
    --text-light: #ffffff;
    
    --border-color: #dce8f5;
    --border-card: #eaf0f8;
    
    --shadow-sm: 0 2px 5px rgba(0, 54, 110, 0.04);
    --shadow-md: 0 4px 14px rgba(0, 54, 110, 0.07);
    --shadow-lg: 0 8px 24px rgba(0, 54, 110, 0.12);
    
    --radius-card: 16px;
    --radius-banner: 18px;
    --radius-icon: 13px;
    --radius-input: 14px;
    
    --font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* CSS Reset & Global Settings */
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html {
  width: 100%;
  overflow-x: clip;
  }

  body {
    font-family: var(--font-family);
    background-color: #e5edf5;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    
  }

  /* Mobile App Container Shell */
  .portal-app-wrapper {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    background-color: var(--bg-page);
    position: relative;
    box-shadow: 0 0 35px rgba(0, 38, 77, 0.12);
    display: flex;
    flex-direction: column;
    overflow-x: clip;
  }

  /* ==========================================================================
     HERO SECTION
     ========================================================================== */
  .hero-brand-logo {
        width: 190px;
        height: auto;
        margin-bottom: 16px;
      }

      .hero-brand-logo img {
        display: block;
        width: 100%;
        height: auto;
        max-width: 100%;
        object-fit: contain;
      }
  .hero-container {
  position: sticky;
  top: 0;
  width: 100%;
  height: 200px;
  background-color: var(--brand-blue-dark);
  overflow: hidden;
  z-index: 100;
}

  .hero-bg-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: translateX(25%);
    z-index: 1;
  }

  /* Realistic blue gradient overlay: Left is vibrant blue, right reveals the building */
  .hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(0, 63, 130, 0.98) 0%,
    rgba(0, 78, 150, 0.96) 28%,
    rgba(0, 84, 166, 0.82) 48%,
    rgba(0, 84, 166, 0.48) 68%,
    rgba(0, 84, 166, 0.08) 100%
  );
  z-index: 2;
}

  /* Subtle top-to-bottom shading */
  .hero-overlay-vertical {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0, 45, 95, 0.55) 0%,
      rgba(0, 70, 140, 0.15) 50%,
      rgba(0, 75, 150, 0.70) 100%
    );
    z-index: 3;
  }

  /* Hero Content */
  .hero-content {
    position: relative;
    z-index: 4;
    padding: 34px 20px 0 20px;
    color: var(--text-light);
  }

  .hero-brand-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.8px;
    line-height: 1.1;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0, 20, 50, 0.3);
  }

  .hero-brand-sub {
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 7px;
    color: #ffffff;
    opacity: 0.95;
    margin-top: 1px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .hero-cyan-bar {
    width: 38px;
    height: 3.5px;
    background: var(--brand-cyan);
    border-radius: 2px;
    margin-bottom: 15px;
    box-shadow: 0 0 10px var(--brand-cyan-glow);
    /* Tambahan animasi */
    animation: pantulKiriKanan 2.0s infinite ease-in-out;
}

/* Keyframes untuk efek bergerak ke kiri dan kanan */
@keyframes pantulKiriKanan {
    0%, 100% {
        transform: translateX(0);
    }
    25% {
        transform: translateX(-5px);
    }
    75% {
        transform: translateX(35px);
    }
}

  .hero-portal-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.25;
    color: #ffffff;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .hero-portal-tagline {
    font-size: 13.5px;
    font-weight: 400;
    color: #e3f2fd;
    opacity: 0.95;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tagline-dot {
    font-size: 10px;
    color: var(--brand-cyan);
  }

  /* Lower Curved White Wave - Pixel-perfect curve matching reference */
  .hero-curve-wrapper {
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    line-height: 0;
    z-index: 5;
    pointer-events: none;
  }

  .hero-curve-svg {
    display: block;
    width: 100%;
    height: 48px;
  }

  /* ==========================================================================
     WELCOME BANNER
     ========================================================================== */
  .welcome-section {
    padding: 6px 16px 14px 16px;
    position: relative;
    z-index: 10;
  }

  .welcome-card {
    background: var(--surface-soft);
    border-radius: var(--radius-banner);
    padding: 16px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    border: 1px solid #ddecfa;
  }

  .welcome-left {
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 2;
  }

  .welcome-hand {
    font-size: 32px;
    display: inline-block;
    animation: wave-animation 2.2s infinite ease-in-out;
    transform-origin: 70% 70%;
  }

  @keyframes wave-animation {
    0% { transform: rotate(0deg); }
    10% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    30% { transform: rotate(14deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
    60% { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }

  .welcome-text h2 {
    font-size: 17px;
    font-weight: 700;
    color: var(--brand-blue-dark);
    margin-bottom: 2px;
    line-height: 1.25;
  }

  .welcome-text p {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.35;
  }

  .welcome-graphic {
    position: relative;
    width: 80px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    z-index: 1;
    opacity: 0.9;
  }

  /* ==========================================================================
     SEARCH SECTION
     ========================================================================== */
  .search-section {
    padding: 0 16px 16px 16px;
  }

  .search-box {
    position: relative;
    width: 100%;
  }

  .search-icon-wrapper {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 46px;
    background-color: var(--surface);
    border: 1.5px solid var(--border-color);
    border-radius: var(--radius-input);
    padding: 0 16px 0 44px;
    font-family: var(--font-family);
    font-size: 14px;
    color: var(--text-primary);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .search-input::placeholder {
    color: #92a4ba;
    font-weight: 400;
  }

  .search-input:focus {
    outline: none;
    border-color: var(--brand-blue);
    box-shadow: 0 0 0 3.5px rgba(0, 84, 166, 0.12);
  }

  .search-clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    display: none;
  }

  /* ==========================================================================
     SERVICE CATEGORIES & CARDS
     ========================================================================== */
  .main-content {
    flex: 1;
    padding-bottom: 24px;
  }

  .category-group {
    margin-bottom: 18px;
  }

  .category-header {
    padding: 8px 16px 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .category-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .category-icon {
    color: var(--brand-blue);
    display: flex;
    align-items: center;
  }

  .category-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--brand-blue);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .category-chevron {
    color: var(--brand-blue);
    display: flex;
    align-items: center;
    opacity: 0.8;
  }

  .services-list {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  /* Service Card */
  .service-card {
    background-color: var(--surface);
    border-radius: var(--radius-card);
    border: 1px solid var(--border-card);
    box-shadow: var(--shadow-sm);
    padding: 11px 14px;
    display: flex;
    align-items: center;
    gap: 13px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    touch-action: manipulation;
  }

  .service-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    background-color: var(--surface-hover);
  }

  .service-card:active {
    transform: scale(0.985);
    box-shadow: var(--shadow-sm);
  }

  /* Card Icon Box */
  .card-icon-box {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: var(--radius-icon);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  .card-icon-box svg {
    width: 22px;
    height: 22px;
    stroke-width: 2.1;
  }

  /* Card Text */
  .card-info {
    flex: 1;
    min-width: 0;
  }

  .card-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.25;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-description {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-arrow {
    color: #9cb1c9;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Empty Search State */
  .empty-state {
    padding: 40px 20px;
    text-align: center;
    display: none;
  }

  .empty-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 12px auto;
    border-radius: 50%;
    background-color: #e2edf8;
    color: var(--brand-blue);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .empty-subtitle {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Skeleton Loading State */
  .skeleton-card {
    height: 66px;
    background: #ffffff;
    border-radius: var(--radius-card);
    border: 1px solid var(--border-card);
    padding: 11px 14px;
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .skeleton-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-icon);
    background: linear-gradient(90deg, #e7edf5 25%, #f4f8fc 50%, #e7edf5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }

  .skeleton-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .skeleton-line-title {
    width: 60%;
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(90deg, #e7edf5 25%, #f4f8fc 50%, #e7edf5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }

  .skeleton-line-desc {
    width: 85%;
    height: 11px;
    border-radius: 4px;
    background: linear-gradient(90deg, #e7edf5 25%, #f4f8fc 50%, #e7edf5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ==========================================================================
     FOOTER SECTION
     ========================================================================== */
  .portal-footer {
    background: linear-gradient(180deg, #003264 0%, #001f40 100%);
    color: #ffffff;
    padding: 10px 16px 10px 16px;
    text-align: center;
    position: relative;
  }

  .footer-top-wave {
    position: absolute;
    top: -1px;
    left: 0;
    width: 100%;
    line-height: 0;
  }

  .footer-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #ffffff;
    margin-bottom: 1px;
  }

  .footer-copyright {
    font-size: 11px;
    font-weight: 400;
    color: #8da9ce;
    letter-spacing: 0.2px;
  }

  /* Mobile screen query adjustments */
  @media (max-width: 380px) {
    .hero-bg-img {
        object-position: 100% center;
        transform: translateX(18%);
    }
    .hero-container {
      height: 190px;
    }
    .hero-brand-title {
      font-size: 23px;
    }
    .hero-portal-title {
      font-size: 17px;
    }
    .welcome-card {
      padding: 13px 14px;
    }
    .welcome-hand {
      font-size: 28px;
    }
    .welcome-text h2 {
      font-size: 15.5px;
    }
  }
</style>
