<style>
  /* ==========================================================================
     LIPPO PLAZA BAUBAU — ADMIN PANEL DESIGN SYSTEM
     Based on Admin Blueprint (ref1.png)
     ========================================================================== */

  :root {
    --adm-blue-primary: #0054a6;
    --adm-blue-dark: #003870;
    --adm-blue-light: #eef5fc;
    --adm-blue-soft: #f4f8fd;
    --adm-cyan: #20d7f3;
    
    --adm-bg: #f8fafc;
    --adm-surface: #ffffff;
    --adm-sidebar: #06284f;
    --adm-sidebar-hover: #0a3568;
    --adm-sidebar-active: #0054a6;
    
    --adm-text-main: #1e293b;
    --adm-text-sub: #64748b;
    --adm-text-muted: #94a3b8;
    --adm-text-white: #ffffff;
    
    --adm-border: #e2e8f0;
    --adm-border-soft: #f1f5f9;
    
    --adm-success: #10b981;
    --adm-success-bg: #ecfdf5;
    --adm-warning: #f59e0b;
    --adm-danger: #ef4444;
    --adm-danger-bg: #fef2f2;
    
    --adm-radius: 12px;
    --adm-radius-sm: 8px;
    --adm-radius-lg: 16px;
    --adm-shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --adm-shadow-md: 0 4px 12px rgba(0, 84, 166, 0.08);
    --adm-shadow-lg: 0 10px 25px rgba(0, 84, 166, 0.12);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body.admin-body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--adm-bg);
    color: var(--adm-text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Admin App Shell */
  .admin-layout {
    display: flex;
    min-height: 100vh;
    width: 100%;
  }

  /* Sidebar */
  .admin-sidebar {
    width: 250px;
    background-color: var(--adm-sidebar);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: transform 0.3s ease;
    z-index: 100;
  }

  .sidebar-brand {
    padding: 24px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .sidebar-logo-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--adm-blue-primary), var(--adm-cyan));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(32, 215, 243, 0.3);
  }

  .sidebar-brand-text h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.2;
    color: #ffffff;
  }

  .sidebar-brand-text span {
    font-size: 11px;
    color: var(--adm-cyan);
    font-weight: 500;
  }

  .sidebar-menu {
    padding: 16px 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    list-style: none;
    overflow-y: auto;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: var(--adm-radius-sm);
    color: #cbd5e1;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
    text-decoration: none;
  }

  .menu-item:hover {
    background-color: var(--adm-sidebar-hover);
    color: #ffffff;
  }

  .menu-item.active {
    background-color: var(--adm-sidebar-active);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(0, 84, 166, 0.35);
  }

  .menu-item-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* User Profile at Bottom of Sidebar */
  .sidebar-user {
    padding: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-user-info {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .sidebar-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background-color: #1e3a8a;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    border: 2px solid rgba(255, 255, 255, 0.15);
  }

  .sidebar-user-details {
    min-width: 0;
  }

  .sidebar-user-name {
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-user-role {
    font-size: 11px;
    color: #94a3b8;
  }

  .btn-logout {
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    transition: color 0.2s, background-color 0.2s;
  }

  .btn-logout:hover {
    color: var(--adm-danger);
    background-color: rgba(239, 68, 68, 0.1);
  }

  /* Main View Area */
  .admin-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow-x: hidden;
  }

  /* Header Topbar */
  .admin-header {
    height: 64px;
    background-color: var(--adm-surface);
    border-bottom: 1px solid var(--adm-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .btn-toggle-sidebar {
    display: none;
    background: none;
    border: none;
    color: var(--adm-text-sub);
    cursor: pointer;
    padding: 6px;
  }

  .header-page-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--adm-text-main);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-portal-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: var(--adm-radius-sm);
    border: 1px solid var(--adm-border);
    font-size: 13px;
    font-weight: 500;
    color: var(--adm-blue-primary);
    text-decoration: none;
    background-color: var(--adm-surface);
    transition: all 0.2s ease;
  }

  .header-portal-link:hover {
    background-color: var(--adm-blue-light);
  }

  /* Content Wrapper */
  .admin-content {
    padding: 24px;
    flex: 1;
  }

  .admin-view {
    display: none;
  }

  .admin-view.active {
    display: block;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ==========================================================================
     DASHBOARD STYLES (Panel 2 of ref1.png)
     ========================================================================== */
  .dash-banner {
    background: linear-gradient(135deg, var(--adm-blue-primary), var(--adm-blue-dark));
    border-radius: var(--adm-radius-lg);
    padding: 22px 24px;
    color: #ffffff;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--adm-shadow-md);
  }

  .dash-banner h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .dash-banner p {
    font-size: 13.5px;
    color: #e2e8f0;
  }

  /* KPI Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background-color: var(--adm-surface);
    border-radius: var(--adm-radius);
    padding: 18px 20px;
    border: 1px solid var(--adm-border-soft);
    box-shadow: var(--adm-shadow-sm);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .kpi-icon-box {
    width: 48px;
    height: 48px;
    border-radius: var(--adm-radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .kpi-details {
    flex: 1;
  }

  .kpi-label {
    font-size: 12.5px;
    color: var(--adm-text-sub);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .kpi-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--adm-text-main);
    line-height: 1.2;
  }

  .kpi-sub {
    font-size: 11.5px;
    color: var(--adm-text-muted);
    margin-top: 2px;
  }

  /* Dashboard Section Layout (Two columns) */
  .dash-grid-2 {
    display: grid;
    grid-template-columns: 2fr 1.2fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  .card-box {
    background-color: var(--adm-surface);
    border-radius: var(--adm-radius);
    border: 1px solid var(--adm-border-soft);
    box-shadow: var(--adm-shadow-sm);
    padding: 20px;
  }

  .card-box-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .card-box-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--adm-text-main);
  }

  /* Quick Actions Grid */
  .quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn-quick {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: var(--adm-radius-sm);
    border: 1px solid var(--adm-border);
    background-color: var(--adm-surface);
    color: var(--adm-text-main);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-quick:hover {
    background-color: var(--adm-blue-light);
    border-color: var(--adm-blue-primary);
    color: var(--adm-blue-primary);
  }

  /* Status System Box */
  .status-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .status-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background-color: var(--adm-bg);
    border-radius: var(--adm-radius-sm);
    font-size: 13px;
  }

  .badge-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .badge-online {
    background-color: var(--adm-success-bg);
    color: var(--adm-success);
  }

  .badge-offline {
    background-color: var(--adm-danger-bg);
    color: var(--adm-danger);
  }

  /* ==========================================================================
     TABLES & CRUD VIEWS (Panel 3 & 5 of ref1.png)
     ========================================================================== */
  .table-actions-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .table-filters {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    max-width: 450px;
  }

  .input-search-table {
    flex: 1;
    height: 40px;
    border: 1px solid var(--adm-border);
    border-radius: var(--adm-radius-sm);
    padding: 0 14px;
    font-size: 13.5px;
    font-family: inherit;
  }

  .input-search-table:focus {
    outline: none;
    border-color: var(--adm-blue-primary);
  }

  .select-filter {
    height: 40px;
    border: 1px solid var(--adm-border);
    border-radius: var(--adm-radius-sm);
    padding: 0 12px;
    font-size: 13.5px;
    background-color: #ffffff;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-primary {
    background-color: var(--adm-blue-primary);
    color: #ffffff;
    border: none;
    padding: 9px 18px;
    border-radius: var(--adm-radius-sm);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.2s;
    font-family: inherit;
  }

  .btn-primary:hover {
    background-color: var(--adm-blue-dark);
  }

  .btn-secondary {
    background-color: #f1f5f9;
    color: var(--adm-text-main);
    border: 1px solid var(--adm-border);
    padding: 9px 18px;
    border-radius: var(--adm-radius-sm);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-secondary:hover {
    background-color: #e2e8f0;
  }

  /* Responsive Data Table */
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--adm-border);
    border-radius: var(--adm-radius);
    background-color: var(--adm-surface);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 13.5px;
  }

  .data-table th {
    background-color: #f8fafc;
    color: var(--adm-text-sub);
    font-weight: 600;
    padding: 12px 16px;
    border-bottom: 1px solid var(--adm-border);
    white-space: nowrap;
  }

  .data-table td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--adm-border-soft);
    color: var(--adm-text-main);
    vertical-align: middle;
  }

  .data-table tr:last-child td {
    border-bottom: none;
  }

  .data-table tr:hover td {
    background-color: #f8fafc;
  }

  .table-service-name {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .table-service-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    flex-shrink: 0;
  }

  .table-service-icon svg {
    width: 18px;
    height: 18px;
  }

  .table-actions-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-action-icon {
    background: none;
    border: none;
    padding: 6px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--adm-text-sub);
    transition: color 0.15s, background-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-action-icon:hover {
    background-color: #f1f5f9;
    color: var(--adm-blue-primary);
  }

  .btn-action-icon.danger:hover {
    background-color: var(--adm-danger-bg);
    color: var(--adm-danger);
  }

  /* Status Toggle Switch / Pill */
  .status-toggle-pill {
    cursor: pointer;
    border: none;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s;
  }

  .status-toggle-pill.active {
    background-color: var(--adm-success-bg);
    color: var(--adm-success);
  }

  .status-toggle-pill.inactive {
    background-color: #f1f5f9;
    color: var(--adm-text-muted);
  }

  /* ==========================================================================
     MODALS & LIVE SERVICE PREVIEW (Panel 4 of ref1.png)
     ========================================================================== */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(15, 23, 42, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    overflow-y: auto;
  }

  .modal-backdrop.show {
    display: flex;
  }

  .modal-dialog {
    background-color: var(--adm-surface);
    border-radius: var(--adm-radius-lg);
    width: 100%;
    max-width: 780px;
    box-shadow: var(--adm-shadow-lg);
    overflow: hidden;
    animation: modalSlide 0.25s ease;
  }

  @keyframes modalSlide {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--adm-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--adm-text-main);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--adm-text-sub);
    cursor: pointer;
    font-size: 20px;
    padding: 4px;
  }

  .modal-body {
    padding: 24px;
  }

  .modal-split {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 24px;
  }

  /* Live Preview Box (Matches Panel 4) */
  .live-preview-box {
    background-color: var(--adm-bg);
    border: 1px solid var(--adm-border);
    border-radius: var(--adm-radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .preview-box-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--adm-text-sub);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    width: 100%;
    text-align: left;
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--adm-border);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  /* Form Controls */
  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--adm-text-main);
    margin-bottom: 6px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    height: 40px;
    border: 1px solid var(--adm-border);
    border-radius: var(--adm-radius-sm);
    padding: 0 14px;
    font-size: 13.5px;
    font-family: inherit;
  }

  .form-textarea {
    height: 72px;
    padding: 10px 14px;
    resize: vertical;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--adm-blue-primary);
  }

  /* Color Presets Pill Bar */
  .color-presets-bar {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .color-pill-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid #ffffff;
    box-shadow: 0 0 0 1px var(--adm-border);
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .color-pill-btn:hover {
    transform: scale(1.15);
  }

  .color-pill-btn.selected {
    box-shadow: 0 0 0 2.5px var(--adm-blue-primary);
  }

  /* ==========================================================================
     LOGIN & SETUP VIEW (Panel 1 of ref1.png)
     ========================================================================== */
  .login-screen-wrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg, #002e5b, #0054a6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
  }

  .login-card {
    background-color: var(--adm-surface);
    border-radius: var(--adm-radius-lg);
    width: 100%;
    max-width: 420px;
    padding: 36px 32px;
    box-shadow: 0 20px 45px rgba(0, 30, 70, 0.25);
    text-align: center;
  }

  .login-brand-badge {
    width: 54px;
    height: 54px;
    margin: 0 auto 16px auto;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--adm-blue-primary), var(--adm-cyan));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 22px;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(32, 215, 243, 0.35);
  }

  .login-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--adm-text-main);
    margin-bottom: 4px;
  }

  .login-subtitle {
    font-size: 13px;
    color: var(--adm-text-sub);
    margin-bottom: 24px;
  }

  .login-form {
    text-align: left;
  }

  .login-footer-text {
    margin-top: 24px;
    font-size: 11.5px;
    color: var(--adm-text-muted);
  }

  /* Toast Notifications */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .toast-alert {
    padding: 12px 18px;
    border-radius: var(--adm-radius-sm);
    color: #ffffff;
    font-size: 13.5px;
    font-weight: 500;
    box-shadow: var(--adm-shadow-md);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toastIn 0.3s ease;
  }

  .toast-alert.success { background-color: #059669; }
  .toast-alert.error { background-color: #dc2626; }
  .toast-alert.info { background-color: #0284c7; }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive Rules */
  @media (max-width: 900px) {
    .dash-grid-2 {
      grid-template-columns: 1fr;
    }
    .modal-split {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 768px) {
    .admin-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      transform: translateX(-100%);
    }
    .admin-sidebar.open {
