<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lippo Plaza Baubau â€” Digital Service Portal</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
  /* ==========================================================================
     LIPPO PLAZA BAUBAU â€” DIGITAL SERVICE PORTAL
     Mobile-First Design System & Stylesheet
     ========================================================================== */

  :root {
    --brand-blue: #0054a6;
    --brand-blue-dark: #003f82;
    --brand-blue-deep: #00264d;
    --brand-cyan: #20d7f3;
    --brand-cyan-glow: rgba(32, 215, 243, 0.4);
    
    --bg-page: #f2f7fc;
    --surface: #ffffff;
    --surface-soft: #eaf4fd;
    --surface-hover: #f8fbfe;
    
    --text-primary: #172b4d;
    --text-secondary: #4a6585;
    --text-muted: #7a8fa6;
    --text-light: #ffffff;
    
    --border-color: #dce8f5;
    --border-card: #eaf0f8;
    
    --shadow-sm: 0 2px 5px rgba(0, 54, 110, 0.04);
    --shadow-md: 0 4px 14px rgba(0, 54, 110, 0.07);
    --shadow-lg: 0 8px 24px rgba(0, 54, 110, 0.12);
    
    --radius-card: 16px;
    --radius-banner: 18px;
    --radius-icon: 13px;
    --radius-input: 14px;
    
    --font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* CSS Reset & Global Settings */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: var(--font-family);
    background-color: #e5edf5;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Mobile App Container Shell */
  .portal-app-wrapper {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    background-color: var(--bg-page);
    position: relative;
    box-shadow: 0 0 35px rgba(0, 38, 77, 0.12);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ==========================================================================
     HERO SECTION
     ========================================================================== */
  .hero-container {
    position: relative;
    width: 100%;
    height: 290px;
    background-color: var(--brand-blue-dark);
    overflow: hidden;
  }

  .hero-bg-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: right top;
    z-index: 1;
  }

  /* Realistic blue gradient overlay: Left is vibrant blue, right reveals the building */
  .hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      90deg,
      rgba(0, 75, 150, 0.96) 0%,
      rgba(0, 84, 166, 0.90) 38%,
      rgba(0, 95, 185, 0.65) 62%,
      rgba(0, 84, 166, 0.20) 100%
    );
    z-index: 2;
  }

  /* Subtle top-to-bottom shading */
  .hero-overlay-vertical {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      180deg,
      rgba(0, 45, 95, 0.55) 0%,
      rgba(0, 70, 140, 0.15) 50%,
      rgba(0, 75, 150, 0.70) 100%
    );
    z-index: 3;
  }

  /* Hero Content */
  .hero-content {
    position: relative;
    z-index: 4;
    padding: 34px 20px 0 20px;
    color: var(--text-light);
  }

  .hero-brand-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.8px;
    line-height: 1.1;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0, 20, 50, 0.3);
  }

  .hero-brand-sub {
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 7px;
    color: #ffffff;
    opacity: 0.95;
    margin-top: 1px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .hero-cyan-bar {
    width: 38px;
    height: 3.5px;
    background: var(--brand-cyan);
    border-radius: 2px;
    margin-bottom: 15px;
    box-shadow: 0 0 10px var(--brand-cyan-glow);
  }

  .hero-portal-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.25;
    color: #ffffff;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .hero-portal-tagline {
    font-size: 13.5px;
    font-weight: 400;
    color: #e3f2fd;
    opacity: 0.95;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tagline-dot {
    font-size: 10px;
    color: var(--brand-cyan);
  }

  /* Lower Curved White Wave - Pixel-perfect curve matching reference */
  .hero-curve-wrapper {
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    line-height: 0;
    z-index: 5;
    pointer-events: none;
  }

  .hero-curve-svg {
    display: block;
    width: 100%;
    height: 48px;
  }

  /* ==========================================================================
     WELCOME BANNER
     ========================================================================== */
  .welcome-section {
    padding: 6px 16px 14px 16px;
    position: relative;
    z-index: 10;
  }

  .welcome-card {
    background: var(--surface-soft);
    border-radius: var(--radius-banner);
    padding: 16px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    border: 1px solid #ddecfa;
  }

  .welcome-left {
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 2;
  }

  .welcome-hand {
    font-size: 32px;
    display: inline-block;
    animation: wave-animation 2.2s infinite ease-in-out;
    transform-origin: 70% 70%;
  }

  @keyframes wave-animation {
    0% { transform: rotate(0deg); }
    10% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    30% { transform: rotate(14deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
    60% { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }

  .welcome-text h2 {
    font-size: 17px;
    font-weight: 700;
    color: var(--brand-blue-dark);
    margin-bottom: 2px;
    line-height: 1.25;
  }

  .welcome-text p {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.35;
  }

  .welcome-graphic {
    position: relative;
    width: 80px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    z-index: 1;
    opacity: 0.9;
  }

  /* ==========================================================================
     SEARCH SECTION
     ========================================================================== */
  .search-section {
    padding: 0 16px 16px 16px;
  }

  .search-box {
    position: relative;
    width: 100%;
  }

  .search-icon-wrapper {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 46px;
    background-color: var(--surface);
    border: 1.5px solid var(--border-color);
    border-radius: var(--radius-input);
    padding: 0 16px 0 44px;
    font-family: var(--font-family);
    font-size: 14px;
    color: var(--text-primary);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .search-input::placeholder {
    color: #92a4ba;
    font-weight: 400;
  }

  .search-input:focus {
    outline: none;
    border-color: var(--brand-blue);
    box-shadow: 0 0 0 3.5px rgba(0, 84, 166, 0.12);
  }

  .search-clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    display: none;
  }

  /* ==========================================================================
     SERVICE CATEGORIES & CARDS
     ========================================================================== */
  .main-content {
    flex: 1;
    padding-bottom: 24px;
  }

  .category-group {
    margin-bottom: 18px;
  }

  .category-header {
    padding: 8px 16px 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .category-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .category-icon {
    color: var(--brand-blue);
    display: flex;
    align-items: center;
  }

  .category-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--brand-blue);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .category-chevron {
    color: var(--brand-blue);
    display: flex;
    align-items: center;
    opacity: 0.8;
  }

  .services-list {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  /* Service Card */
  .service-card {
    background-color: var(--surface);
    border-radius: var(--radius-card);
    border: 1px solid var(--border-card);
    box-shadow: var(--shadow-sm);
    padding: 11px 14px;
    display: flex;
    align-items: center;
    gap: 13px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    touch-action: manipulation;
  }

  .service-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    background-color: var(--surface-hover);
  }

  .service-card:active {
    transform: scale(0.985);
    box-shadow: var(--shadow-sm);
  }

  /* Card Icon Box */
  .card-icon-box {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: var(--radius-icon);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  .card-icon-box svg {
    width: 22px;
    height: 22px;
    stroke-width: 2.1;
  }

  /* Card Text */
  .card-info {
    flex: 1;
    min-width: 0;
  }

  .card-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.25;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-description {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-arrow {
    color: #9cb1c9;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Empty Search State */
  .empty-state {
    padding: 40px 20px;
    text-align: center;
    display: none;
  }

  .empty-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 12px auto;
    border-radius: 50%;
    background-color: #e2edf8;
    color: var(--brand-blue);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .empty-subtitle {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Skeleton Loading State */
  .skeleton-card {
    height: 66px;
    background: #ffffff;
    border-radius: var(--radius-card);
    border: 1px solid var(--border-card);
    padding: 11px 14px;
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .skeleton-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-icon);
    background: linear-gradient(90deg, #e7edf5 25%, #f4f8fc 50%, #e7edf5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }

  .skeleton-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .skeleton-line-title {
    width: 60%;
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(90deg, #e7edf5 25%, #f4f8fc 50%, #e7edf5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }

  .skeleton-line-desc {
    width: 85%;
    height: 11px;
    border-radius: 4px;
    background: linear-gradient(90deg, #e7edf5 25%, #f4f8fc 50%, #e7edf5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ==========================================================================
     FOOTER SECTION
     ========================================================================== */
  .portal-footer {
    background: linear-gradient(180deg, #003264 0%, #001f40 100%);
    color: #ffffff;
    padding: 26px 16px 36px 16px;
    text-align: center;
    position: relative;
  }

  .footer-top-wave {
    position: absolute;
    top: -1px;
    left: 0;
    width: 100%;
    line-height: 0;
  }

  .footer-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #ffffff;
    margin-bottom: 6px;
  }

  .footer-copyright {
    font-size: 11px;
    font-weight: 400;
    color: #8da9ce;
    letter-spacing: 0.2px;
  }

  /* Mobile screen query adjustments */
  @media (max-width: 380px) {
    .hero-container {
      height: 275px;
    }
    .hero-brand-title {
      font-size: 23px;
    }
    .hero-portal-title {
      font-size: 17px;
    }
    .welcome-card {
      padding: 13px 14px;
    }
    .welcome-hand {
      font-size: 28px;
    }
    .welcome-text h2 {
      font-size: 15.5px;
    }
  }
</style>

  function handleDataLoaded(response) {
    if (!response || !response.success || !response.data) {
      handleDataError(response ? response.error : 'Format data tidak valid');
      return;
    }

    portalData = response.data;
    applySettings(portalData.settings);
    renderCategoriesAndServices(portalData.categories, portalData.services);
  }

  function handleDataError(err) {
    console.warn('Gagal mengambil data server:', err);
    // If we have local mock or previous data, keep it
    if (portalData.services && portalData.services.length > 0) {
      renderCategoriesAndServices(portalData.categories, portalData.services);
    }
  }

  /**
   * Apply dynamic settings to DOM
   */
  function applySettings(settings) {
    if (!settings) return;
    if (settings.tagline && portalTaglineEl) {
      portalTaglineEl.innerHTML = escapeHtml(settings.tagline);
    }
    if (settings.footer_title && footerTitleEl) {
      footerTitleEl.textContent = settings.footer_title;
    }
    if (settings.footer_copyright && footerCopyrightEl) {
      footerCopyrightEl.textContent = settings.footer_copyright;
    }
    if (settings.background_url && heroBackground) {
      heroBackground.src = settings.background_url;
    }
  }

  /**
   * Render Categories & Service Cards
   */
  function renderCategoriesAndServices(categories, services, filterText = '') {
    if (!servicesContainer) return;
    servicesContainer.innerHTML = '';

    const query = filterText.trim().toLowerCase();
    let totalVisible = 0;

    categories.forEach(category => {
      // Filter services belonging to this category
      const categoryServices = services.filter(service => {
        if (service.category_id !== category.id) return false;
        if (!query) return true;

        const nameMatch = (service.name || '').toLowerCase().includes(query);
        const descMatch = (service.description || '').toLowerCase().includes(query);
        const catMatch = (category.name || '').toLowerCase().includes(query);
        return nameMatch || descMatch || catMatch;
      });

      if (categoryServices.length === 0) return;

      totalVisible += categoryServices.length;

      // Create Category Group
      const group = document.createElement('div');
      group.className = 'category-group';

      // Header
      const header = document.createElement('div');
      header.className = 'category-header';
      header.innerHTML = `
        <div class="category-title-wrap">
          <span class="category-icon" style="width: 18px; height: 18px;">
            ${getIconSvg(category.icon || 'building-2')}
          </span>
          <span class="category-name">${escapeHtml(category.name)}</span>
        </div>
        <div class="category-chevron" style="width: 16px; height: 16px;">
          ${getIconSvg('chevron-right')}
        </div>
      `;
      group.appendChild(header);

      // Services List
      const list = document.createElement('div');
      list.className = 'services-list';

      categoryServices.forEach(service => {
        const card = createServiceCard(service);
        list.appendChild(card);
      });

      group.appendChild(list);
      servicesContainer.appendChild(group);
    });

    // Handle Empty Search State
    if (emptyState) {
      if (totalVisible === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }
    }
  }

  /**
   * Build Individual Service Card
   */
  function createServiceCard(service) {
    const card = document.createElement('div');
    card.className = 'service-card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `${service.name} - ${service.description}`);

    const iconBg = service.icon_background || '#1e88e5';
    const iconName = service.icon || 'package';

    card.innerHTML = `
      <div class="card-icon-box" style="background-color: ${iconBg};">
        ${getIconSvg(iconName)}
      </div>
      <div class="card-info">
        <div class="card-title">${escapeHtml(service.name)}</div>
        <div class="card-description">${escapeHtml(service.description || '')}</div>
      </div>
      <div class="card-arrow" style="width: 18px; height: 18px;">
        ${getIconSvg('chevron-right')}
      </div>
    `;

    // Click Handler: MUST open form in new tab, never iframe, never replace portal
    card.addEventListener('click', () => {
      openServiceUrl(service.url);
    });

    // Keyboard Accessibility
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openServiceUrl(service.url);
      }
    });

    return card;
  }

  /**
   * Safe external link launcher
   */
  function openServiceUrl(url) {
    if (!url || url === '#') {
      alert('Layanan ini akan segera tersedia.');
      return;
    }
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  /**
   * Setup Search Filter Events
   */
  function setupSearchEvents() {
    if (!searchInput) return;

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      if (searchClearBtn) {
        searchClearBtn.style.display = val.length > 0 ? 'block' : 'none';
      }
      renderCategoriesAndServices(portalData.categories, portalData.services, val);
    });

    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchClearBtn.style.display = 'none';
        searchInput.focus();
        renderCategoriesAndServices(portalData.categories, portalData.services, '');
      });
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
